name: Publish to PyPI

# Pubblicazione SOLO manuale: Actions > "Publish to PyPI" > Run workflow.
# (Nessun trigger automatico su release: il publish su PyPI lo si fa a mano.)
#
# Stessa forma del workflow di s3Dgraphy, di proposito: due pacchetti che si
# rilasciano in due modi diversi diventano due procedure da ricordare, e quella
# usata meno spesso è quella che si sbaglia.
#
# DUE DOMANDE DIVERSE, DUE LAVORI DIVERSI, e tenerle separate è il punto:
#   · «gira sulla versione più vecchia che il pacchetto promette?» — si risponde
#     solo su 3.9, ed è ciò che `requires-python = ">=3.9"` afferma;
#   · «ha davvero zero dipendenze?» — si risponde in modo ESATTO solo da 3.10 in
#     su, perché `sys.stdlib_module_names` non esiste prima.
# Farle girare tutte e due sullo stesso interprete significa che una delle due
# non viene posta. Prima di questo file giravano entrambe su 3.9, e la seconda
# non falliva per un difetto del pacchetto: falliva perché non poteva essere
# posta lì.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        required: true
        default: 'testpypi'
        type: choice
        options:
        - testpypi
        - pypi
      version_tag:
        description: 'Git tag to publish (e.g., v0.1.0)'
        required: true
        type: string

jobs:

  # LA SUITE SU OGNI VERSIONE CHE IL PACCHETTO PROMETTE. `requires-python` è una
  # riga in un file finché nessuno la mette alla prova; qui diventa una misura.
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version_tag }}
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pytest, and NOTHING else
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    - name: Run the suite against a bare interpreter
      run: python -m pytest -q -rs

  # LA PROMESSA DEL PACCHETTO, VERIFICATA DOVE LA DOMANDA HA UNA RISPOSTA ESATTA.
  # Sotto 3.10 quei due test si saltano — e il salto è accettabile SOLO perché il
  # rilascio dipende da QUESTO lavoro, dove non possono saltare. La prima riga lo
  # rende impossibile da dimenticare: se un domani qualcuno abbassa la versione
  # qui, il lavoro si ferma invece di diventare verde a vuoto.
  zero-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version_tag }}
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: This job must RUN the exact check, never skip it
      run: |
        python -c "import sys; assert hasattr(sys, 'stdlib_module_names'), \
          'this job exists to run the exact zero-dependency check: it needs 3.10+'"
    - name: Measure the dependencies from the interpreter itself
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        python -m pytest -q -rs -k ZeroDependencies

  manual-publish:
    needs: [suite, zero-dependencies]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout specific tag
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version_tag }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Confirm target
      run: |
        echo "🎯 Publishing to: ${{ github.event.inputs.target }}"
        echo "🏷️ Using tag: ${{ github.event.inputs.version_tag }}"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        python -m twine check dist/*

    # IL TAG DEVE COINCIDERE CON LA VERSIONE COSTRUITA. Senza questo controllo si
    # può pubblicare `v0.2.0` contenente 0.1.0, e su PyPI non si corregge: si può
    # solo pubblicare un'altra versione sopra.
    - name: The tag must match the version in the artefact
      env:
        VERSION_TAG: ${{ github.event.inputs.version_tag }}
      run: |
        python - <<'PY'
        import os, pathlib, re, sys
        tag = os.environ["VERSION_TAG"].lstrip("v")
        built = sorted(p.name for p in pathlib.Path("dist").glob("*.whl"))
        if not built:
            sys.exit("no wheel in dist/")
        version = re.match(r"[^-]+-([^-]+)-", built[0]).group(1)
        print(f"tag={tag!r} wheel={version!r} ({built[0]})")
        if tag != version:
            sys.exit(f"REFUSING: tag {tag!r} does not match built version {version!r}")
        PY

    - name: Publish to TestPyPI
      if: github.event.inputs.target == 'testpypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip-existing: true

    - name: Publish to PyPI (PRODUCTION)
      if: github.event.inputs.target == 'pypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
