# .github/workflows/release.yml
name: Build EM Tools Extensions (Multi-Platform)

on:
  push:
    tags:
      - 'v*.*.*'      # Stable releases (v1.5.0)
      - 'v*.*.*-rc.*' # Release candidates (v1.5.0-rc.1)
      - 'v*.*.*-dev.*' # Dev releases (v1.5.0-dev.43)
  
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v1.5.0-dev.43)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows-x64, macosx-arm64, macosx-x64, linux-x64]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # The Blender range, the wheels' cp tag and the package name of this
      # Python come from ONE place: scripts/version_manager.py (BLENDER_TARGETS).
      # 3.11 → Blender 4.4–5.0.x (max 5.1.0, exclusive) · 3.13 → Blender 5.1+.
      - name: Blender target of this Python
        id: pytag
        run: |
          python scripts/version_manager.py target --python-version ${{ matrix.python-version }} | tee -a "$GITHUB_OUTPUT"

      - name: Download platform-specific wheels
        run: |
          CP_TAG="${{ steps.pytag.outputs.cp_tag }}"
          mkdir -p wheels/$CP_TAG

          # Map GitHub platform to pip platform tags
          case "${{ matrix.platform }}" in
            windows-x64)
              PIP_PLATFORM="win_amd64"
              ;;
            macosx-arm64)
              PIP_PLATFORM="macosx_11_0_arm64"
              ;;
            macosx-x64)
              PIP_PLATFORM="macosx_10_13_x86_64"
              ;;
            linux-x64)
              PIP_PLATFORM="manylinux2014_x86_64"
              ;;
          esac

          echo "Downloading wheels for $PIP_PLATFORM (Python ${{ matrix.python-version }})..."

          # Download each package for the specific platform and Python version
          while IFS= read -r package || [ -n "$package" ]; do
            # Skip empty lines and comments
            [[ -z "$package" || "$package" =~ ^[[:space:]]*# ]] && continue

            echo "Downloading $package for $PIP_PLATFORM ($CP_TAG)..."
            pip download "$package" \
              --only-binary=:all: \
              --platform="$PIP_PLATFORM" \
              --python-version=${{ matrix.python-version }} \
              --implementation=cp \
              --abi=$CP_TAG \
              -d wheels/$CP_TAG/ || true
          done < scripts/requirements_wheels.txt

          # List downloaded wheels
          echo "Downloaded wheels:"
          ls -la wheels/$CP_TAG/

      - name: Create platform-specific package
        run: |
          PLATFORM="${{ matrix.platform }}"
          VERSION="${{ steps.version.outputs.version }}"
          PY_VER="${{ matrix.python-version }}"
          CP_TAG="${{ steps.pytag.outputs.cp_tag }}"
          PACKAGE_NAME="em_tools-v${VERSION}-${PLATFORM}-${{ steps.pytag.outputs.package_tag }}.zip"

          mkdir -p build

          # Copy all addon files except development files (the wheels apart:
          # only this Python's, flattened into build/wheels/ below)
          rsync -a --exclude='.git' \
                    --exclude='.github' \
                    --exclude='scripts' \
                    --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='/build' \
                    --exclude='/wheels' \
                    --exclude='*.blext' \
                    --exclude='.gitignore' \
                    --exclude='blender_manifest.toml' \
                    --exclude='blender_manifest_template.toml' \
                    --exclude='version.json' \
                    --exclude='em.bat' \
                    --exclude='em.sh' \
                    --exclude='.vscode' \
                    --exclude='.zenodo.json' \
                    --exclude='build_extension.bat' \
                    --exclude='build_extension.sh' \
                    --exclude='build_extension.py' \
                    --exclude='delete_pycache.bat' \
                    --exclude='delete_pycache.sh' \
                    --exclude='sync_dev.bat' \
                    --exclude='sync_dev.sh' \
                    . build/

          mkdir -p build/wheels
          cp wheels/$CP_TAG/*.whl build/wheels/

          # The manifest of THIS package: the tag's version, this Python's
          # wheels (flat), its Blender range
          python scripts/version_manager.py render \
            --python-version "$PY_VER" --version "$VERSION" \
            --wheels-prefix wheels --output build/blender_manifest.toml

          # FAIL the build when a listed wheel is for another CPython, is not
          # in the package, or the Blender range admits another Python
          python scripts/check_manifest.py build --python-version "$PY_VER"

          cd build
          zip -qr "../${PACKAGE_NAME}" . -x "*.pyc" "__pycache__/*"
          cd ..
          python scripts/check_manifest.py "${PACKAGE_NAME}" --python-version "$PY_VER"

          echo "Created package: ${PACKAGE_NAME}"
          ls -la "${PACKAGE_NAME}"
          echo "package_name=${PACKAGE_NAME}" >> $GITHUB_ENV

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: em_tools-${{ matrix.platform }}-${{ steps.pytag.outputs.package_tag }}
          path: ${{ env.package_name }}
  
  release:
    needs: build
    runs-on: ubuntu-latest
    # Crea una GitHub Release per OGNI tag: i pre-release (-dev/-rc/-alpha/-beta)
    # come "prerelease", gli altri come stabili. Le pre-release sono necessarie per
    # i link di download persistenti degli asset (/releases/download/<tag>/<file>).
    # NB: l'archiviazione su Zenodo NON e' piu' gestita dal webhook repo-wide
    # (va disattivato in Zenodo > Settings > GitHub): le release stabili vanno
    # archiviate separatamente, cosi' le dev non finiscono su Zenodo.
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      
      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      
      - name: Check if prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" =~ -(dev|rc|alpha|beta) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "release_type=pre-release" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_type=stable" >> $GITHUB_OUTPUT
          fi
      
      # The body names each package and its Blender range from
      # scripts/version_manager.py, the same table the packages were built from
      - name: Release notes
        run: |
          python3 scripts/version_manager.py release-notes \
            --tag "${{ steps.version.outputs.tag }}" \
            --release-type "${{ steps.prerelease.outputs.release_type }}" > release_body.md
          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EM Tools ${{ steps.version.outputs.tag }}
          files: em_tools-*.zip
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zenodo:
    needs: build
    runs-on: ubuntu-latest
    # Archivia su Zenodo SOLO le release STABILI (non -dev/-rc/-alpha/-beta),
    # via API deposizioni -- NON il webhook (disattivato: dopo la migrazione a
    # InvenioRDM falliva con errore vuoto). Job separato e NON bloccante: se
    # fallisce, la GitHub Release e i link di download restano validi e quella
    # stabile si archivia a mano. Richiede il secret ZENODO_TOKEN (scope
    # deposit:write + deposit:actions); se manca, lo script salta senza errore.
    if: >-
      ${{ github.event_name == 'push'
          && !contains(github.ref_name, '-dev')
          && !contains(github.ref_name, '-rc')
          && !contains(github.ref_name, '-alpha')
          && !contains(github.ref_name, '-beta') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source archive
        run: |
          TAG="${{ github.ref_name }}"
          git archive --format=zip --prefix="EM-blender-tools-${TAG}/" HEAD \
            -o "EM-blender-tools-${TAG}.zip"
          ls -la "EM-blender-tools-${TAG}.zip"

      - name: Publish source to Zenodo (stable only)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_CONCEPT: "4459272"
          TAG: ${{ github.ref_name }}
          SRC_ZIP: "EM-blender-tools-${{ github.ref_name }}.zip"
        run: python3 scripts/zenodo_publish.py