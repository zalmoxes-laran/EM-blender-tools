[pytest]
testpaths = tests
python_files = test_*.py
# --rootdir=tests + --confcutdir=tests keep pytest from walking into the
# repo-root __init__.py (the Blender addon entry-point that does
# `import bpy` at module level — fails outside Blender). Tests still
# resolve `import_operators` etc. because `pythonpath` below puts the
# repo root on sys.path; pytest just doesn't TRY to import the rootdir
# as a package. See conftest.py for the full story / migration notes.
addopts = -v --tb=short --import-mode=importlib --rootdir=tests --confcutdir=tests
pythonpath = . tests
norecursedirs = .venv .git .idea __pycache__
